services:
  frontend:
    image: ghcr.io/rgss-cs/williams-rgss-website-dev-frontend/frontend:latest
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - internetwork
    pull_policy: always

  cap:
    image: tiago2/cap:latest
    container_name: cap
    ports:
      - "3001:3000"
    environment:
      ADMIN_KEY: ${ADMIN_KEY}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internetwork

  valkey:
    image: valkey/valkey:9-alpine
    container_name: cap-valkey
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internetwork

volumes:
  valkey-data:

networks:
  internetwork:
    driver: bridge
    external: true
